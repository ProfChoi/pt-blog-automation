name: Daily PT Blog

on:
  schedule:
    - cron: '30 23 * * 1,3,6'  # 화·목·일 KST 08:30 (기존 일정 유지)
  workflow_dispatch:
    inputs:
      check_smtp:
        description: 'SMTP 인증만 검사 (초안 생성·메일 발송 없음)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pt-blog-mail-delivery
  cancel-in-progress: false

jobs:
  run-blog:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      DELIVERY_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: 최신 기본 브랜치 체크아웃
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 패키지 설치
        run: python -m pip install -r requirements.txt

      - name: 오프라인 회귀 테스트
        run: python -m unittest discover -s tests -v

      - name: 상태 기록용 Git 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 블로그 초안 생성 및 Gmail SMTP 발송
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CHECK_SMTP: ${{ inputs.check_smtp }}
        run: |
          if [ "$CHECK_SMTP" = "true" ]; then
            python fetch_and_write.py --check-smtp
          else
            python fetch_and_write.py
          fi
