name: Daily PT Blog (GPT-6.1 Terra)

on:
  schedule:
    - cron: '30 23 * * 1,3,6'  # Sunday, Tuesday, Thursday 08:30 Asia/Seoul
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 저장하기 (이메일 발송/기사기록 수정 안 함)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: pt-blog-production
  cancel-in-progress: false

jobs:
  run-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install "openai>=2,<3" requests beautifulsoup4

      - name: Run non-network unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate draft using GPT-6.1 Terra
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python fetch_and_write.py

      - name: Upload preview draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: pt-blog-preview
          path: preview_output/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit used article after successful email
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_articles.txt
          git diff --staged --quiet || git commit -m "Update used articles"
          git push
