name: PT Blog Pipeline Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install "openai>=2,<3" requests beautifulsoup4
      - name: Check Python syntax
        run: python -m py_compile fetch_and_write.py tests/test_pipeline.py
      - name: Run tests without API calls
        run: python -m unittest discover -s tests -v
