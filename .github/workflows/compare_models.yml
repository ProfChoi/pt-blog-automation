name: PT Blog Model Comparison (Manual Only)

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "Psychology Today 기사 URL (두 모델에 동일 적용)"
        required: true
        type: string
        default: "https://www.psychologytoday.com/us/blog/cutting-edge-leadership/202611/the-lame-duck-a-leaders-exit-can-be-bad-or-good"
      email_results:
        description: "비교 원고 두 편을 이메일로도 받기 (기본: 발송 안 함)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install model clients
        run: python -m pip install --upgrade "openai>=2.0" "anthropic>=0.50" requests beautifulsoup4

      - name: Create two draft versions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ARTICLE_URL: ${{ inputs.article_url }}
          EMAIL_RESULTS: ${{ inputs.email_results }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python compare_blog_models.py

      - name: Save comparison drafts as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-blog-comparison
          path: experiment_output/
          if-no-files-found: warn
          retention-days: 7
